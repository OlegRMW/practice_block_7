[project]
name = "text-summary-block-7"
version = "0.1.0"
description = ""
authors = [
    {name = "OlegRMW", email = "zagudpev@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "pandas (>=3.1.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "nltk (>=3.10.4,<4.0.0)",
    "evaluate (>=0.4.6,<0.5.0)",
    "rouge-score (>=0.1.2,<0.2.0)",
    "sacrebleu (>=2.6.0,<3.0.0)",

    "torch==2.14.0+cu130",
    "torchvision==0.29.0+cu130",

    "transformers (==5.17.0)",
    "accelerate (>=1.15.0,<2.0.0)",
    "ollama (>=0.6.3,<0.7.0)",
    "tqdm (>=4.70.1,<5.0.0)",

    "trl==1.15.0",
    "peft",
    "datasets>=4.8.5,<5.0.0",
    "unsloth==2026.11.4",
    "unsloth-zoo==2026.11.4",
    "triton-windows (>=3.8,<3.9)",
    "openai (>=3.49.0,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pyyaml (>=6.0,<7.0)",
    "rich (>=15.0,<16.0)",
    "psutil (>=7.0,<8.0)",
    "nvidia-ml-py (>=12.0,<15.0)"
]


[tool.poetry]
packages = [{include = "text_summary_block_7", from = "src"}]

[tool.poetry.dependencies]
torch = {source = "pytorch-cu130"}
torchvision = {source = "pytorch-cu130"}

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
